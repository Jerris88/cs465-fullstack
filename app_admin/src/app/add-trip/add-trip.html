<h2>Add Trip</h2>

<!-- Link to return to the trip listing page -->
<p>
  <a routerLink="/trips">Back</a>
</p>

<!-- Form used to create a new trip -->
<form (ngSubmit)="onSubmit()" #tripForm="ngForm">

  <!-- Trip code input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Code*</label><br>
    <input
      type="text"
      name="code"
      [(ngModel)]="trip.code"
      required
    />
  </div>

  <!-- Trip name input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Name*</label><br>
    <input
      type="text"
      name="name"
      [(ngModel)]="trip.name"
      required
    />
  </div>

  <!-- Trip length input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Length* (e.g., "4 nights")</label><br>
    <input
      type="text"
      name="length"
      [(ngModel)]="trip.length"
      required
    />
  </div>

  <!-- Trip start date input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Start Date*</label><br>
    <input
      type="date"
      name="start"
      [(ngModel)]="trip.start"
      required
    />
  </div>

  <!-- Resort name input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Resort*</label><br>
    <input
      type="text"
      name="resort"
      [(ngModel)]="trip.resort"
      required
    />
  </div>

  <!-- Price per person input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Per Person* (e.g., "$1,450.00")</label><br>
    <input
      type="text"
      name="perPerson"
      [(ngModel)]="trip.perPerson"
      required
    />
  </div>

  <!-- Image path input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Image Path (e.g., "images/reef4.jpg")</label><br>
    <input
      type="text"
      name="image"
      [(ngModel)]="trip.image"
    />
  </div>

  <!-- Trip description input -->
  <div style="margin-bottom: 0.5rem;">
    <label>Description</label><br>
    <textarea
      name="description"
      rows="3"
      [(ngModel)]="trip.description"
    ></textarea>
  </div>

  <!-- Error message displayed when form validation fails -->
  <div *ngIf="formError" style="color: red; margin-bottom: 0.5rem;">
    {{ formError }}
  </div>

  <!-- Submit button to save the trip -->
  <button type="submit">Save Trip</button>

  <!-- Cancel link that returns to the trip listing -->
  <a routerLink="/trips" style="margin-left: 0.5rem;">Cancel</a>
</form>
