<!-- Login stays left aligned with a normal page margin -->
<div style="max-width: 520px;">

  <!-- Admin login heading -->
  <h2 style="margin-bottom: 0.75rem;">Admin Login</h2>

  <!-- Navigate back to trip listing -->
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm mb-3"
    (click)="goToTrips()"
  >
    Back to Trips
  </button>

  <!-- Login form using Angular template-driven forms -->
  <form (ngSubmit)="onLogin()" #loginForm="ngForm">

    <!-- Email input -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        [(ngModel)]="credentials.email"
        required
      />
    </div>

    <!-- Password input -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        [(ngModel)]="credentials.password"
        required
      />
    </div>

    <!-- Submit button disabled when form is invalid -->
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="loginForm.invalid"
    >
      Log In
    </button>

    <!-- Error message shown on failed login -->
    <p *ngIf="errorMessage" class="text-danger mt-3">
      {{ errorMessage }}
    </p>

  </form>

</div>
