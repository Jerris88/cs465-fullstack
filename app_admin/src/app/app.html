<div style="margin: 1rem;">

  <!-- App header with logo and title -->
  <div style="display: flex; align-items: center; margin-bottom: 1rem;">

    <!-- Travlr Getaways logo pulled from public/images -->
    <img
      src="images/logo.png"
      alt="Travlr Getaways Logo"
      style="height: 48px; margin-right: 0.75rem;"
    />

    <!-- App title -->
    <h1 style="margin: 0;">{{ title }}</h1>

  </div>

  <!-- Navigation shows login when logged out (hidden on the login page to avoid duplicates) -->
  <p *ngIf="!isLoggedIn() && !isLoginRoute()" style="margin-bottom: 1.5rem;">

    <!-- Navigate to login page -->
    <button
      routerLink="/login"
      class="btn btn-outline-primary btn-sm"
    >
      Login
    </button>

  </p>

  <!-- Navigation shows admin actions only after login -->
  <p *ngIf="isLoggedIn()" style="margin-bottom: 1.5rem;">

    <!-- Navigate to add trip page -->
    <button
      routerLink="/add-trip"
      class="btn btn-primary btn-sm"
      style="margin-right: 0.5rem;"
    >
      Add Trip
    </button>

    <!-- Log out and return to login -->
    <button
      (click)="logout()"
      class="btn btn-outline-secondary btn-sm"
    >
      Logout
    </button>

  </p>

  <!-- Route content renders here -->
  <router-outlet></router-outlet>

</div>
