<div class="card h-100">
  <img [src]="'http://localhost:3000/' + trip.image" class="card-img-top" alt="{{ trip.name }}">

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">
      <strong>Code:</strong> {{ trip.code }}<br>
      <strong>Length:</strong> {{ trip.length }}<br>
      <strong>Start:</strong> {{ trip.start }}<br>
      <strong>Resort:</strong> {{ trip.resort }}<br>
      <strong>Per Person:</strong> {{ trip.perPerson }}
    </p>

    <!-- Trip description (shown on cards like the guide) -->
    <p *ngIf="trip.description" class="card-text">
      {{ trip.description }}
    </p>

    <!-- Admin actions only show after login -->
    <div *ngIf="isLoggedIn()" class="d-flex gap-2">
      <a class="btn btn-primary btn-sm" [routerLink]="['/edit-trip', trip.code]">Edit Trip</a>
      <button class="btn btn-danger btn-sm" type="button" (click)="deleteTrip()">Delete</button>
    </div>
  </div>
</div>
